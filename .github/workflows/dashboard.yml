# Every weekday evening, after the COMEX settlement: new prices, the netbacks and the page.
# The PortWatch file is downloaded by hand and is not refreshed here.
name: dashboard

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt git+https://github.com/rongardF/tvdatafeed.git
      - run: python -m src.download
      - run: python -m src.sql
      - run: python -m src.data
      - run: python -m src.netback
      - run: python -m src.dashboard
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "Daily refresh $(date -u +%Y-%m-%d)" || echo "nothing new"
          git push
